<script>
  // Mobile nav dismissal. Bootstrap's collapse plugin opens and closes the menu
  // but never closes it on an outside tap, on Escape, or when the viewport grows
  // past the expand breakpoint — all three are expected of a menu today. Purely
  // additive: without this script the hamburger still opens and closes normally.
  //
  // Everything routes through toggler.click() rather than the Collapse API so
  // Quarto's own inline onclick (which parks headroom.js while the menu is open)
  // keeps firing on close exactly as it does on open.
  (function () {
    const toggler = document.querySelector(".navbar .navbar-toggler");
    const panel = document.querySelector(".navbar .navbar-collapse");
    if (!toggler || !panel) return;

    const isOpen = () => toggler.getAttribute("aria-expanded") === "true";
    const close = () => { if (isOpen()) toggler.click(); };

    // Bubble phase, so the click that opened the menu is still inside the
    // toggler when this runs and is excluded below.
    document.addEventListener("click", function (e) {
      if (!isOpen()) return;
      if (panel.contains(e.target) || toggler.contains(e.target)) return;
      close();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && isOpen()) {
        close();
        toggler.focus();   // return focus to what the visitor was operating
      }
    });

    // Past the breakpoint the links are laid out inline again; leaving the menu
    // flagged open would spring the sheet back open on the next resize down (and
    // strand the toggler as an X). Reads `expanded.matches` rather than the
    // event's, so both listeners below can share the one handler.
    const expanded = window.matchMedia("(min-width: 992px)");
    const syncToViewport = function () { if (expanded.matches) close(); };

    // Safari <14 has no addEventListener on MediaQueryList, only addListener.
    if (expanded.addEventListener) {
      expanded.addEventListener("change", syncToViewport);
    } else if (expanded.addListener) {
      expanded.addListener(syncToViewport);
    }
  })();
</script>
<!-- Progressive-enhancement "read more" for research abstracts.
     Abstracts render in full (no-JS friendly); this collapses them to a few lines

     item out with `showFullAbstract: true` (which omits `data-collapsible`). -->
<script>
(function () {
  function init() {
    var abstracts = document.querySelectorAll('.ri-desc[data-collapsible]');
    abstracts.forEach(function (desc, i) {
      desc.classList.add('is-clamped');
      // If the clamped text doesn't overflow, it's short enough — show it in full.
      if (desc.scrollHeight <= desc.clientHeight + 2) {
        desc.classList.remove('is-clamped');
        return;
      }
      desc.classList.add('has-toggle');
      if (!desc.id) desc.id = 'abstract-' + (i + 1);

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ri-more';
      btn.setAttribute('aria-expanded', 'false');
      btn.setAttribute('aria-controls', desc.id);
      btn.innerHTML =
        '<span class="ri-more-label">Read more</span>' +
        '<span class="ri-more-chev" aria-hidden="true">▾</span>';
      desc.insertAdjacentElement('afterend', btn);

      btn.addEventListener('click', function () {
        var clamped = desc.classList.toggle('is-clamped');
        btn.setAttribute('aria-expanded', String(!clamped));
        btn.querySelector('.ri-more-label').textContent = clamped ? 'Read more' : 'Show less';

    document.addEventListener('DOMContentLoaded', init);
  } else {

  }

<!-- Upcoming-talks filter. The `.upcoming-talks` block is hidden by default; this
     removes any talk whose `data-until` (falling back to `data-date`) is before
     today on the visitor's own clock, sorts the rest chronologically, and reveals
     the block only if at least one upcoming talk remains. ISO date strings compare
     chronologically, so no Date parsing (and no timezone surprises) is needed. -->
<script>
(function () {
  function init() {
    var section = document.querySelector('.upcoming-talks');
    if (!section) return;
    var talks = Array.prototype.slice.call(section.querySelectorAll('.talk'));
    if (!talks.length) return;

    var n = new Date();
    var today = n.getFullYear() + '-' +
      String(n.getMonth() + 1).padStart(2, '0') + '-' +
      String(n.getDate()).padStart(2, '0');

    var cutoff = function (t) { return t.getAttribute('data-until') || t.getAttribute('data-date') || ''; };
    var start  = function (t) { return t.getAttribute('data-date') || t.getAttribute('data-until') || ''; };

    var upcoming = talks.filter(function (t) { return cutoff(t) >= today; });
    talks.forEach(function (t) { if (upcoming.indexOf(t) === -1) t.remove(); });
    if (!upcoming.length) return;   // nothing in the future → stay hidden

    upcoming.sort(function (a, b) { return start(a) < start(b) ? -1 : start(a) > start(b) ? 1 : 0; });
    var parent = upcoming[0].parentNode;
    upcoming.forEach(function (t) { parent.appendChild(t); });   // re-order in place

    section.classList.add('is-visible');
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
